name: Update fantasy site

on:
  schedule:
    - cron: "*/15 22-23,0-5 * * *"   # every 15 min during NBA games (~9am-4pm Melbourne)
    - cron: "17 6-21/4 * * *"        # every 4 hours the rest of the day
  workflow_dispatch:                 # "Run workflow" button (always refreshes the AI too)

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Fetch ESPN data
        env:
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          MY_TEAM: ${{ vars.MY_TEAM }}
        run: python fetch_data.py

      - name: Get last AI report from the live site
        run: curl -fsSL --max-time 20 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ai.json" -o data/ai.json || echo "No previous report"

      - name: AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_EVERY_HOURS: "4"
          FORCE_AI: ${{ github.event_name == 'workflow_dispatch' }}
        timeout-minutes: 5
        continue-on-error: true
        run: python ai_report.py

      - run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
